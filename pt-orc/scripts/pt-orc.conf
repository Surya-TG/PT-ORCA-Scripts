COMMIX_TIMEOUT=30                       # per-request timeout (seconds)

# arjun — hidden HTTP parameter discovery
ARJUN_THREADS=10                        # parallel discovery threads

# tplmap — server-side template injection
TPLMAP_LEVEL=5                          # 1-5 payload depth

# ghauri — advanced / second-order SQLi
GHAURI_LEVEL=1                          # 1-3 (deep forces 3)

# ffuf — payload fuzzing (LFI / path traversal / RFI)
FFUF_THREADS=50                         # parallel requests
FFUF_TIMEOUT=10                         # per-request timeout (seconds)

# Global active fuzz options (apply to all tools)
FUZZ_TIMEOUT=3600                       # max seconds per tool per target (default: 1h)
FUZZ_THREADS=5                          # default thread count where not overridden
FUZZ_COOKIE=""                          # session cookie forwarded to all tools
                                        # e.g. "PHPSESSID=abc123; token=xyz"
FUZZ_AUTH_HEADER=""                     # auth header forwarded to all tools
                                        # e.g. "Authorization: Bearer <token>"
FUZZ_PROXY=""                           # HTTP proxy for all tools
                                        # e.g. "http://127.0.0.1:8080" (routes via Burp)

# =============================================================================
# VULN CORPUS (23_vuln_corpus.sh)
# =============================================================================

# Nuclei full-suite severity for the corpus run.
# Step 11 T04 runs a targeted subset; step 23 runs the full 9,500+ template
# suite filtered to these severities.
NUCLEI_FULL_SEVERITY="critical,high"

# Max CVEs returned per service from NVD keyword sweep.
CORPUS_NVD_RESULTS_PER_SERVICE=100

# Minimum CVSS score to include in corpus JSONL findings.
# 0 = include all (noisy). 7.0 = High and above (recommended).
CORPUS_MIN_CVSS=7.0

# OSV.dev ecosystems to probe for package-level vulnerabilities.
# Comma-separated list. Empty = skip OSV sweep entirely.
CORPUS_OSV_ECOSYSTEMS="PyPI,npm,Go,Maven,RubyGems"

# Maximum services to sweep through NVD per run (guards against huge MSF DBs).
CORPUS_MAX_SERVICES=50

# =============================================================================
# ATTACK CHAIN AI (24_attack_chain.sh)
# =============================================================================

# Maximum findings fed into the AI synthesis prompt.
# LLM context limits apply; 200 is safe for most models (≈40k tokens).
CHAIN_MAX_INPUT_FINDINGS=200

# Number of ranked attack chains to generate in the output.
CHAIN_OUTPUT_PATHS=5

# Minimum confidence level to include a chain in the report.
# Values: confirmed | unverified | speculative
CHAIN_MIN_CONFIDENCE="unverified"

# AI synthesis model override for step 24 kill-chain reasoning.
# Opus is used here because multi-step attack chain construction requires
# deeper reasoning than bulk synthesis tasks handled by AI_CLAUDE_MODEL.
CHAIN_AI_MODEL="claude-opus-4-8"

# =============================================================================
# OSINT RECON (02_osint.sh)
# =============================================================================

# GitHub/GitLab personal access token for API searches and trufflehog scanning.
# Scope needed: read:org, repo (public), read:user — no write access required.
OSINT_GITHUB_TOKEN=""

# HaveIBeenPwned (HIBP) API key — required for domain breach search.
# NOTE: /api/v3/breacheddomain/{domain} is a paid-tier endpoint; a free key
#       only covers email lookups. Obtain at https://haveibeenpwned.com/API/Key
HIBP_API_KEY=""

# Dehashed API credentials — for breach credential lookup by domain.
# Register at https://dehashed.com — both email and API key are required.
DEHASHED_API_EMAIL=""
DEHASHED_API_KEY=""

# theHarvester sources to query (comma-separated).
# Full list: google,bing,linkedin,twitter,github,securityTrails,hunter,shodan,...
# Omit linkedin if not authorised to enumerate employee data in scope definition.
OSINT_HARVESTER_SOURCES="google,bing,duckduckgo,github"

# Maximum documents to download for metadata extraction (T04).
# Applies per domain. Larger values increase run time.
OSINT_MAX_DOCS=20
